# GitHub Pages 자동 배포: 이 브랜치에 푸시하면 게임 파일만 모아서 배포
name: Deploy to GitHub Pages

on:
  push:
    branches: [ccr-c6d3f2ba-48fdyc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 게임 파일만 모으기
        run: |
          mkdir _site
          cp -r index.html css js _site/
          if [ -d assets ]; then cp -r assets _site/; fi
          touch _site/.nojekyll
      - name: 캐시 무효화용 버전 붙이기
        # 브라우저가 옛 JS/CSS를 캐시에서 쓰지 않도록 모든 모듈 주소에 커밋 버전을 붙임
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(src=\"js/main\.js)\"#\1?v=$V\"#; s#(href=\"css/style\.css)\"#\1?v=$V\"#" _site/index.html
          sed -i -E "s#((from|import) '\./[A-Za-z]+\.js)'#\1?v=$V'#g" _site/js/*.js
          grep -c "?v=$V" _site/index.html _site/js/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
